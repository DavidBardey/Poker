<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Horloge des blinds</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="clock-body">
  <audio id="music" autoplay loop>
    <source src="{{ url_for('static', filename='Takefive.mp3') }}" type="audio/mpeg">
  </audio>

  <main class="clock">
    <h1>PARTIE EN COURS</h1>
    <p class="version-tag">Version corrigée : filtre strict du killeur</p>
    <div class="clock-grid">
      <section class="clock-card">
        <div id="level" class="level">Niveau {{ state.current_level }}</div>
        <div id="blinds" class="blinds">{{ state.schedule[0] }}</div>
        <div id="timer" class="timer">00:00</div>
        <div id="next" class="next"></div>
      </section>
      <section class="clock-card">
        <h2>Joueurs en vie</h2>
        <div id="active_players" class="players-list"></div>
        <h2>Éliminés</h2>
        <div id="eliminated_players" class="players-list eliminated"></div>
      </section>
    </div>

    <section class="controls">
      <button onclick="previousLevel()">Niveau précédent</button>
      <button id="pauseBtn" onclick="togglePause()">Pause</button>
      <button class="kill" onclick="openKillModal()">Kill / Pause</button>
      <button onclick="nextLevel()">Niveau suivant</button>
      <button class="export" onclick="finishGame()">Fin de partie + Excel</button>
    </section>
  </main>

  <div id="killModal" class="modal hidden">
    <div class="modal-box">
      <h2>Gestion du kill</h2>
      <label>Joueur killé</label>
      <select id="killedPlayer" onchange="onKilledPlayerChanged()" onkeyup="onKilledPlayerChanged()" onclick="onKilledPlayerChanged()"></select>
      <label>Résultat</label>
      <select id="outcome">
        <option value="rebuy">Le joueur recave</option>
        <option value="out">Le joueur est définitivement éliminé</option>
      </select>
      <label>Joueur qui a fait le kill</label>
      <select id="killerPlayer"></select>
      <p id="killerHelp" class="hint"></p>
      <div class="modal-actions">
        <button onclick="submitKill()">Valider</button>
        <button onclick="closeKillModal()">Annuler</button>
      </div>
      <p id="killError" class="error-text"></p>
    </div>
  </div>

  <div id="winnerModal" class="modal hidden">
    <canvas id="fireworks"></canvas>
    <div class="winner-box">
      <h2>🎉 Félicitations 🎉</h2>
      <p>Le vainqueur de la soirée est :</p>
      <div id="winnerName" class="winner-name"></div>
      <a class="button" href="{{ url_for('export_excel') }}">Télécharger l'Excel</a>
      <button onclick="closeWinnerModal()">Fermer</button>
    </div>
  </div>

  <iframe id="downloadFrame" class="hidden"></iframe>

  <script>
    let state = {{ state | tojson }};
    let running = true;
    let remainingSeconds = state.minutes_per_level * 60;
    let timerHandle = null;
    let recavesRemaining = {};
    state.players.forEach(p => recavesRemaining[p] = state.max_rebuys);

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, "0");
      const s = (seconds % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function currentBlind() {
      const idx = Math.max(0, Math.min(state.current_level - 1, state.schedule.length - 1));
      return state.schedule[idx];
    }

    function render() {
      document.getElementById("level").textContent = `Niveau ${state.current_level}`;
      document.getElementById("blinds").textContent = currentBlind();
      document.getElementById("timer").textContent = formatTime(remainingSeconds);
      const nextIdx = state.current_level;
      document.getElementById("next").textContent = nextIdx < state.schedule.length ? `Niveau suivant : ${state.schedule[nextIdx]}` : "Dernier niveau";
      document.getElementById("active_players").textContent = state.active_players.length ? state.active_players.join(", ") : "aucun";
      document.getElementById("eliminated_players").textContent = state.eliminated_players.length ? state.eliminated_players.join(", ") : "aucun";
    }

    function tick() {
      if (!running) return;
      if (remainingSeconds > 0) {
        remainingSeconds -= 1;
        render();
        timerHandle = setTimeout(tick, 1000);
      } else {
        nextLevel();
      }
    }

    function togglePause() {
      running = !running;
      document.getElementById("pauseBtn").textContent = running ? "Pause" : "Reprendre";
      if (running) tick();
      else if (timerHandle) clearTimeout(timerHandle);
    }

    async function nextLevel() {
      const res = await fetch("/api/level", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({direction: "next"})});
      const data = await res.json();
      state = data.state;
      remainingSeconds = state.minutes_per_level * 60;
      render();
      if (running) {
        if (timerHandle) clearTimeout(timerHandle);
        tick();
      }
    }

    async function previousLevel() {
      const res = await fetch("/api/level", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({direction: "previous"})});
      const data = await res.json();
      state = data.state;
      remainingSeconds = state.minutes_per_level * 60;
      render();
    }

    function fillSelect(select, players) {
      select.innerHTML = "";
      players.forEach(p => {
        const opt = document.createElement("option");
        opt.value = p;
        opt.textContent = p;
        select.appendChild(opt);
      });
    }

    function getVisibleActivePlayersFromKilledSelect() {
      const killedSelect = document.getElementById("killedPlayer");
      return Array.from(killedSelect.options).map(opt => opt.value);
    }

    function updateKillerOptions() {
      const killedSelect = document.getElementById("killedPlayer");
      const killerSelect = document.getElementById("killerPlayer");
      const killedPlayer = killedSelect.value;

      // Filtrage strict à partir de la liste visible dans la fenêtre.
      // Ainsi, si Regis est sélectionné comme joueur killé,
      // Regis est immédiatement retiré de la liste des killeurs possibles.
      const possibleKillers = getVisibleActivePlayersFromKilledSelect()
        .filter(player => player && player !== killedPlayer);

      fillSelect(killerSelect, possibleKillers);

      const help = document.getElementById("killerHelp");
      if (help) {
        help.textContent = possibleKillers.length
          ? `Killeurs possibles : ${possibleKillers.join(", ")}`
          : "Aucun killeur possible.";
      }
    }

    function updateOutcomeOptions() {
      const killedPlayer = document.getElementById("killedPlayer").value;
      const outcomeSelect = document.getElementById("outcome");
      const remaining = recavesRemaining[killedPlayer] ?? state.max_rebuys;
      outcomeSelect.innerHTML = "";

      if (remaining > 0) {
        const rebuy = document.createElement("option");
        rebuy.value = "rebuy";
        rebuy.textContent = `Le joueur recave (${remaining} recave(s) restante(s))`;
        outcomeSelect.appendChild(rebuy);
      }

      const out = document.createElement("option");
      out.value = "out";
      out.textContent = remaining > 0
        ? "Le joueur est définitivement éliminé"
        : "Plus de recave disponible : élimination définitive";
      outcomeSelect.appendChild(out);

      if (remaining <= 0) {
        outcomeSelect.value = "out";
      }
    }

    function onKilledPlayerChanged() {
      updateKillerOptions();
      updateOutcomeOptions();
    }

    function openKillModal() {
      running = false;
      document.getElementById("pauseBtn").textContent = "Reprendre";
      if (timerHandle) clearTimeout(timerHandle);

      if (state.active_players.length <= 1) {
        alert("Il ne reste qu'un joueur actif : la partie est terminée.");
        return;
      }

      const killedSelect = document.getElementById("killedPlayer");
      fillSelect(killedSelect, state.active_players);
      killedSelect.selectedIndex = 0;

      onKilledPlayerChanged();

      document.getElementById("killError").textContent = "";
      document.getElementById("killModal").classList.remove("hidden");
    }

    function closeKillModal() {
      document.getElementById("killModal").classList.add("hidden");
    }

    async function submitKill() {
      const killedPlayer = document.getElementById("killedPlayer").value;
      const killerPlayer = document.getElementById("killerPlayer").value;
      const outcome = document.getElementById("outcome").value;
      const res = await fetch("/api/kill", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({killed_player: killedPlayer, killer: killerPlayer, outcome: outcome})});
      const data = await res.json();
      if (!data.ok) {
        document.getElementById("killError").textContent = data.error;
        return;
      }
      state = data.state;
      if (data.recaves_remaining) recavesRemaining = data.recaves_remaining;
      closeKillModal();
      render();
      if (data.winner) showWinner(data.winner);
    }

    async function finishGame() {
      const res = await fetch("/api/winner");
      const data = await res.json();

      document.getElementById("downloadFrame").src = "/export";

      if (data.winner) {
        showWinner(data.winner);
        setTimeout(() => { window.location.href = "/"; }, 6500);
      } else {
        setTimeout(() => { window.location.href = "/"; }, 1200);
      }
    }

    function showWinner(name) {
      running = false;
      if (timerHandle) clearTimeout(timerHandle);
      document.getElementById("winnerName").textContent = name;
      document.getElementById("winnerModal").classList.remove("hidden");
      startFireworks();
    }

    function closeWinnerModal() {
      document.getElementById("winnerModal").classList.add("hidden");
      window.location.href = "/";
    }

    function startFireworks() {
      const canvas = document.getElementById("fireworks");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      let particles = [];
      function burst() {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height * 0.55 + 40;
        for (let i = 0; i < 55; i++) {
          particles.push({x, y, vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.5) * 7, life: 70, color: `hsl(${Math.random() * 360}, 100%, 65%)`});
        }
      }
      function frame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.04;
          p.life -= 1;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
          ctx.fill();
        });
        particles = particles.filter(p => p.life > 0);
        if (Math.random() < 0.08) burst();
        if (!document.getElementById("winnerModal").classList.contains("hidden")) requestAnimationFrame(frame);
      }
      burst();
      frame();
    }

    render();
    tick();
  </script>
</body>
</html>
