<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <title>{{ t.clock }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="clock-body">
  <audio id="alarmSound" preload="auto">
    <source src="{{ url_for('static', filename='alarm.mp3') }}" type="audio/mpeg">
  </audio>

  <main class="clock">
    <div class="lang-bar clock-lang">
      <a href="{{ url_for('set_lang', code='fr') }}">FR</a>
      <a href="{{ url_for('set_lang', code='es') }}">ES</a>
      <a href="{{ url_for('set_lang', code='en') }}">EN</a>
    </div>

    <h1>{{ t.clock }}</h1>

    <section class="clock-grid">
      <div class="clock-card">
        <div id="level" class="level"></div>
        <div id="blinds" class="blinds"></div>
        <div id="timer" class="timer"></div>
        <div id="next" class="next"></div>
      </div>

      <div class="clock-card">
        <h2>{{ t.alive }}</h2>
        <div id="active_players" class="players-list"></div>

        <h2>{{ t.out }}</h2>
        <div id="eliminated_players" class="players-list eliminated"></div>
      </div>
    </section>

    <section class="controls">
      <button onclick="previousLevel()">{{ t.previous }}</button>
      <button id="pauseBtn" onclick="togglePause()">{{ t.pause }}</button>
      <button class="kill" onclick="openKillModal()">{{ t.kill }}</button>
      <button onclick="nextLevel()">{{ t.next_level }}</button>
      <button class="export" onclick="finishGame()">{{ t.end_excel }}</button>
    </section>
  </main>

  <div id="killModal" class="modal hidden">
    <div class="modal-box">
      <h2>{{ t.kill }}</h2>

      <label>{{ t.killed_player }}</label>
      <select id="killedPlayer" onchange="refreshKillModal()"></select>

      <label>{{ t.outcome }}</label>
      <select id="outcome"></select>

      <label>{{ t.killer }}</label>
      <select id="killerPlayer"></select>

      <p id="killError" class="error-text"></p>

      <div class="actions">
        <button onclick="submitKill()">{{ t.validate }}</button>
        <button onclick="closeKillModal()">{{ t.cancel }}</button>
      </div>
    </div>
  </div>

  <div id="finalModal" class="modal hidden">
    <div class="modal-box final-box">
      <div class="fireworks"></div>
      <h1 id="winnerText"></h1>
      <div id="potBox" class="pot-box"></div>
      <div class="money-bag">💰💵💵💵</div>
      <div id="payoutsBox"></div>
      <a class="button" href="{{ url_for('export') }}">{{ t.end_excel }}</a>
      <a class="button secondary" href="{{ url_for('index') }}">Menu</a>
    </div>
  </div>

  <script>
    const TXT = {{ texts | tojson }};
    let state = {{ state | tojson }};

    let running = true;
    let timerHandle = null;

    let levelDurationMs = state.minutes_per_level * 60 * 1000;
    let levelEndTimestamp = Date.now() + levelDurationMs;
    let remainingSeconds = state.minutes_per_level * 60;

    let alarmUnlocked = false;

    function unlockAlarm() {
      const alarm = document.getElementById("alarmSound");
      if (!alarm || alarmUnlocked) return;

      alarm.volume = 0.9;
      alarm.play()
        .then(() => {
          alarm.pause();
          alarm.currentTime = 0;
          alarmUnlocked = true;
        })
        .catch(() => {
          // Les navigateurs exigent parfois une interaction utilisateur.
          // Le premier clic sur Pause, Kill ou Niveau suivant débloquera le son.
        });
    }

    document.addEventListener("click", unlockAlarm, { once: true });

    function playAlarm() {
      const alarm = document.getElementById("alarmSound");
      if (!alarm) return;

      try {
        alarm.currentTime = 0;
        alarm.volume = 0.9;
        alarm.play();
      } catch (e) {
        console.log("Alarme non jouée :", e);
      }
    }

    function formatTime(s) {
      s = Math.max(0, s);
      const m = Math.floor(s / 60).toString().padStart(2, "0");
      const sec = (s % 60).toString().padStart(2, "0");
      return `${m}:${sec}`;
    }

    function computeRemainingSeconds() {
      if (!running) {
        return remainingSeconds;
      }

      const diffMs = levelEndTimestamp - Date.now();
      return Math.max(0, Math.ceil(diffMs / 1000));
    }

    function resetLevelTimer() {
      levelDurationMs = state.minutes_per_level * 60 * 1000;
      levelEndTimestamp = Date.now() + levelDurationMs;
      remainingSeconds = state.minutes_per_level * 60;
    }

    function render() {
      const levelIndex = Math.max(0, state.current_level - 1);

      document.getElementById("level").textContent =
        `${TXT.level} ${state.current_level}`;

      document.getElementById("blinds").textContent =
        state.schedule[levelIndex] || "-";

      document.getElementById("timer").textContent =
        formatTime(computeRemainingSeconds());

      if (state.current_level < state.schedule.length) {
        document.getElementById("next").textContent =
          `${TXT.next}: ${state.schedule[state.current_level]}`;
      } else {
        document.getElementById("next").textContent = "";
      }

      document.getElementById("active_players").textContent =
        state.active_players.length ? state.active_players.join(", ") : "-";

      document.getElementById("eliminated_players").textContent =
        state.eliminated_players.length ? state.eliminated_players.join(", ") : "-";
    }

    function tick() {
      if (!running) return;

      remainingSeconds = computeRemainingSeconds();
      render();

      if (remainingSeconds <= 0) {
        playAlarm();
        nextLevel(true);
        return;
      }

      timerHandle = setTimeout(tick, 250);
    }

    function stopTimerHandle() {
      if (timerHandle) {
        clearTimeout(timerHandle);
        timerHandle = null;
      }
    }

    function togglePause() {
      unlockAlarm();

      if (running) {
        remainingSeconds = computeRemainingSeconds();
        running = false;
        stopTimerHandle();
        document.getElementById("pauseBtn").textContent = TXT.resume;
      } else {
        running = true;
        levelEndTimestamp = Date.now() + remainingSeconds * 1000;
        document.getElementById("pauseBtn").textContent = TXT.pause;
        tick();
      }

      render();
    }

    async function nextLevel(fromTimer = false) {
      unlockAlarm();
      stopTimerHandle();

      const res = await fetch("/api/level", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({direction: "next"})
      });

      state = await res.json();
      resetLevelTimer();
      render();

      if (running) {
        tick();
      }
    }

    async function previousLevel() {
      unlockAlarm();
      stopTimerHandle();

      const res = await fetch("/api/level", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({direction: "previous"})
      });

      state = await res.json();
      resetLevelTimer();
      render();

      if (running) {
        tick();
      }
    }

    function fillSelect(select, values) {
      select.innerHTML = "";
      values.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = v;
        select.appendChild(opt);
      });
    }

    function rebuysForPlayer(player) {
      return state.events.filter(e =>
        e.action === "Kill" && e.killed === player && e.rebuy === "Oui"
      ).length;
    }

    function refreshKillModal() {
      const killed = document.getElementById("killedPlayer").value;

      const killers = state.active_players.filter(p => p !== killed);
      fillSelect(document.getElementById("killerPlayer"), killers);

      const outcome = document.getElementById("outcome");
      outcome.innerHTML = "";

      const used = rebuysForPlayer(killed);
      const remaining = state.max_rebuys - used;

      if (remaining > 0) {
        const opt = document.createElement("option");
        opt.value = "rebuy";
        opt.textContent = `${TXT.rebuy} (${remaining})`;
        outcome.appendChild(opt);
      }

      const out = document.createElement("option");
      out.value = "out";
      out.textContent = TXT.eliminated;
      outcome.appendChild(out);
    }

    function openKillModal() {
      unlockAlarm();

      if (running) {
        remainingSeconds = computeRemainingSeconds();
        running = false;
        stopTimerHandle();
        document.getElementById("pauseBtn").textContent = TXT.resume;
      }

      if (state.active_players.length <= 1) {
        finishGame();
        return;
      }

      fillSelect(document.getElementById("killedPlayer"), state.active_players);
      refreshKillModal();

      document.getElementById("killError").textContent = "";
      document.getElementById("killModal").classList.remove("hidden");
      render();
    }

    function closeKillModal() {
      document.getElementById("killModal").classList.add("hidden");
    }

    async function submitKill() {
      const killed = document.getElementById("killedPlayer").value;
      const killer = document.getElementById("killerPlayer").value;
      const outcome = document.getElementById("outcome").value;

      const res = await fetch("/api/kill", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({killed, killer, outcome})
      });

      const data = await res.json();

      if (!data.ok) {
        document.getElementById("killError").textContent = data.error;
        return;
      }

      state = data.state;
      closeKillModal();
      render();

      if (state.active_players.length === 1) {
        finishGame();
      }
    }

    async function finishGame() {
      running = false;
      stopTimerHandle();

      const res = await fetch("/api/final");
      const data = await res.json();

      document.getElementById("winnerText").textContent =
        `🏆 ${TXT.winner} ${data.winner}!`;

      document.getElementById("potBox").textContent =
        `${TXT.pot_total}: ${data.pot.toLocaleString()} COP`;

      const payouts = data.payouts.map(p =>
        `<div class="payout-line">${p.rank}. ${p.player} — ${p.percent}% — ${p.amount.toLocaleString()} COP</div>`
      ).join("");

      document.getElementById("payoutsBox").innerHTML = payouts;
      document.getElementById("finalModal").classList.remove("hidden");
    }

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && running) {
        remainingSeconds = computeRemainingSeconds();
        render();

        if (remainingSeconds <= 0) {
          playAlarm();
          nextLevel(true);
        }
      }
    });

    window.addEventListener("focus", () => {
      if (running) {
        remainingSeconds = computeRemainingSeconds();
        render();
      }
    });

    render();
    tick();
  </script>
</body>
</html>
</body>
</html>
