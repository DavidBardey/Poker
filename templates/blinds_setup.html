<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Configuration des blinds</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><script>function rebuildPlayers(){const n=parseInt(document.getElementById("nb_players").value||"6");const box=document.getElementById("players_box");const oldValues={};box.querySelectorAll("input").forEach(input=>{oldValues[input.name]=input.value;});box.innerHTML="";for(let i=1;i<=n;i++){const div=document.createElement("div");div.className="player-input";const inputName=`player_${i}`;const previousValue=oldValues[inputName]||"";div.innerHTML=`<label>Joueur ${i}</label><input name="${inputName}" value="${previousValue}" placeholder="Nom du joueur ${i}" autocomplete="off" required>`;box.appendChild(div);}}window.addEventListener("DOMContentLoaded",rebuildPlayers);</script></head><body><main class="container"><section class="hero"><img src="{{ url_for('static', filename='dealer.png') }}" class="dealer" alt="Dealer"><h1>Mode 3</h1><p>Configuration de la partie</p></section>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form class="panel" method="post"><div class="grid"><label>Nombre de joueurs<input id="nb_players" name="nb_players" type="number" min="2" max="20" value="6" onchange="rebuildPlayers()" required></label><label>Heure limite de fin<input name="end_time" type="time" value="23:00" required></label><label>Cave initiale<input name="buy_in" type="number" min="1" value="1000" required></label><label>Recaves max par joueur<input name="max_rebuys" type="number" min="0" max="20" value="0" required></label></div><h2>Noms des joueurs</h2><p class="hint">Les champs ne sont plus préremplis : écris les vrais noms avant de lancer la partie.</p><div id="players_box" class="players-grid"></div><button class="button" type="submit">Calculer les blinds</button><a class="button secondary" href="{{ url_for('index') }}">Retour</a></form></main></body></html>
